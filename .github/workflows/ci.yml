name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Client tests
        run: npm test
        env:
          CI: true

      - name: Server tests
        run: npm run test:server

      - name: Production build
        run: npm run build
        env:
          CI: true
